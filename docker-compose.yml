
services:
  # ==================================
  # FastAPI Application
  # ==================================
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: employee-api

    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

    ports:
      - "8034:8000"

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - app-network

  # ==================================
  # PostgreSQL Database
  # ==================================
  db:
    image: postgres:18

    container_name: employee-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    networks:
      - app-network

# ==================================
# Persistent Storage
# ==================================
volumes:
  postgres_data:
    name: cloud-native-3-tier-devops_postgres_data

# ==================================
# Docker Network
# ==================================
networks:
  app-network:
    name: cloud-native-3-tier-devops_network
    driver: bridge
